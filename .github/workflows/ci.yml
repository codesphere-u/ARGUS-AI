name: ARGUS AI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Runtime Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies with pip-audit
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip pip-audit
          .audit-venv/bin/pip install --no-cache-dir -e .
          .audit-venv/bin/pip-audit --skip-editable --progress-spinner off

  docker-build:
    name: Docker Image Build & Non-Root Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t argus-ai:ci .
      - name: Verify non-root container & package import
        run: docker run --rm --entrypoint python argus-ai:ci -c "import os, argus_ai; assert os.geteuid() != 0"

  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify core install without [rl] extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -c "import sys; from argus_ai.backtest import BacktestEngine, replay_passport; assert 'matplotlib' not in sys.modules"

      - name: Install dev tooling and run pytest with coverage
        run: |
          pip install -e ".[dev]"
          pytest -v --cov=argus_ai --cov-report=term-missing --cov-fail-under=85

      - name: Enforce Ruff lint and Mypy static type checks
        run: |
          ruff check .
          mypy argus_ai

      - name: Verify CLI deterministic backtest, passport replay, and HTTP server probe
        run: |
          python -m argus_ai.cli backtest --ticker NVDA --bars 140
          python -m argus_ai.cli replay --ticker NVDA
          python - <<'EOF'
          import threading
          import urllib.request
          from argus_ai.http_server import create_server

          srv = create_server("127.0.0.1", 0)
          port = srv.server_port
          thread = threading.Thread(target=srv.serve_forever, daemon=True)
          thread.start()
          try:
              with urllib.request.urlopen(f"http://127.0.0.1:{port}/healthz", timeout=5) as resp:
                  assert resp.status == 200, f"Expected 200, got {resp.status}"
          finally:
              srv.shutdown()
              srv.server_close()
          EOF
