name: ARGUS AI CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full pytest suite (Unit, Committee, Risk, Backtest & Replay)
        run: |
          pytest -v

      - name: Verify CLI deterministic backtest & passport replay
        run: |
          python -m argus_ai.cli backtest --ticker NVDA --bars 140
          python -m argus_ai.cli replay --ticker NVDA
