[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-ai"
version = "2.1.0"
description = "Autonomous Multi-Agent Investment Committee & Trading Desk with Adversarial Dissent, Trade Passports, and Deterministic Replay"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ARGUS AI Quantitative Engineering" }
]
keywords = [
    "multi-agent-systems",
    "algorithmic-trading",
    "ai-agents",
    "risk-management",
    "mcp",
    "backtesting",
    "explainable-ai"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=2.14.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
]
rl = [
    "gymnasium>=1.4.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
argus = "argus_ai.cli:main"

[tool.setuptools.packages.find]
include = ["argus_ai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
