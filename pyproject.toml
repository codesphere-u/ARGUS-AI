[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-ai"
version = "2.1.0"
description = "Autonomous Multi-Agent Investment Committee & Trading Desk with Adversarial Dissent, Trade Passports, and Deterministic Replay"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ARGUS AI Quantitative Engineering" }
]
keywords = [
    "multi-agent-systems",
    "algorithmic-trading",
    "ai-agents",
    "risk-management",
    "mcp",
    "backtesting",
    "explainable-ai"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "rich>=15.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=2.14.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
]
rl = [
    "gymnasium>=0.29.0",
    "matplotlib>=3.8.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]

[project.scripts]
argus = "argus_ai.cli:main"

[tool.setuptools.packages.find]
include = ["argus_ai*"]

[tool.setuptools.package-data]
argus_ai = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["argus_ai"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "alpaca.*",
    "dotenv",
    "google",
    "matplotlib.*",
    "numpy",
    "pandas",
    "pydantic",
    "rich.*",
]
ignore_missing_imports = true
